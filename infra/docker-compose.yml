services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: moneyfast
      POSTGRES_PASSWORD: password
      POSTGRES_DB: moneyfast
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyfast -d moneyfast"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql://moneyfast:password@postgres:5432/moneyfast
      ORCHESTRATOR_URL: http://host.docker.internal:8080
    ports:
      - "8000:8000"
    volumes:
      - ../backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
