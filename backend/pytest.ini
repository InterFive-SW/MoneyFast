[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_functions = test_*
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
addopts =
    -q
    --strict-markers
    --import-mode=importlib
    --cov=app
    --cov-branch
    --cov-report=term-missing:skip-covered
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=100
