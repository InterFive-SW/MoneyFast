# Production overlay. The RAG role password is mounted as a file instead of
# living in the environment; 40-grants.sh reads it during first-boot
# initialisation and never prints it.
#
#   docker compose -f docker-compose.yml -f docker-compose.secrets.example.yml up -d
services:
  vector-db:
    environment:
      RAG_DB_PASSWORD: ""
      RAG_DB_PASSWORD_FILE: /run/secrets/rag_db_password
    secrets:
      - rag_db_password
  ingestor:
    environment:
      X_BEARER_TOKEN: ""
      X_BEARER_TOKEN_FILE: /run/secrets/x_bearer_token
    secrets:
      - x_bearer_token

secrets:
  rag_db_password:
    file: ${RAG_DB_PASSWORD_SECRET_FILE:?Set RAG_DB_PASSWORD_SECRET_FILE}
  x_bearer_token:
    file: ${X_BEARER_TOKEN_SECRET_FILE:?Set X_BEARER_TOKEN_SECRET_FILE}
