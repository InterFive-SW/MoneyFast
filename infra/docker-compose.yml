services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: moneyfast
      POSTGRES_PASSWORD: password
      POSTGRES_DB: moneyfast
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyfast -d moneyfast"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql://moneyfast:password@postgres:5432/moneyfast
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  vector-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: moneyfast_ai
      POSTGRES_PASSWORD: password
      POSTGRES_DB: moneyfast_rag
    volumes:
      - vector_db_data:/var/lib/postgresql/data
      - ./vector-db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyfast_ai -d moneyfast_rag"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mcp-market-data:
    container_name: mcp-moneyfast
    build:
      context: ../AI-Services/moneyfast-orchestrator/mcp-server
    environment:
      MCP_TRANSPORT: sse
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      VECTOR_DB_URL: postgresql://moneyfast_ai:password@vector-db:5432/moneyfast_rag
    depends_on:
      vector-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c 'import socket; socket.create_connection(("127.0.0.1", 8000), 2).close()'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  orchestrator_agent:
    container_name: orchestrator-agent
    build:
      context: ../AI-Services/moneyfast-orchestrator
      dockerfile: Dockerfile
    env_file:
      - ../AI-Services/moneyfast-orchestrator/.env
    environment:
      MCP_SERVER_URL: http://mcp-market-data:8000/sse
      JURISDICTION: ${JURISDICTION:-TR}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-tr-TR}
      MAX_COMPLIANCE_REVISIONS: ${MAX_COMPLIANCE_REVISIONS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      mcp-market-data:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  vector_db_data:
